<div class="employee-container">
    <div class="employee-header">
      <div class="actions-container">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Filter employees...">
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="addNewEmployee()">
          <mat-icon>add</mat-icon> Add Employee
        </button>
      </div>
    </div>
  
    <div class="mat-elevation-z8 table-container">
      <table mat-table [dataSource]="dataSource" class="employee-table">
        
        <!-- ID Column -->
        <ng-container matColumnDef="Employee Code">
          <th mat-header-cell *matHeaderCellDef> Employee Code </th>
          <td mat-cell *matCellDef="let employee"> {{employee.employeeCode}} </td>
        </ng-container>
  
        <!-- Name Column -->
        <ng-container matColumnDef="Name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let employee"> {{employee.name}} </td>
        </ng-container>
  
        <!-- Email Column -->
        <ng-container matColumnDef="Department">
          <th mat-header-cell *matHeaderCellDef> Department </th>
          <td mat-cell *matCellDef="let employee"> {{employee.department}} </td>
        </ng-container>
  
        <!-- Department Column -->
        <ng-container matColumnDef="Position">
          <th mat-header-cell *matHeaderCellDef> Position </th>
          <td mat-cell *matCellDef="let employee"> {{employee.position}} </td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let employee">
            <button mat-icon-button color="primary" (click)="editEmployee(employee)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteEmployee(employee)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        <!-- Row shown when there is no matching data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="8">No data matching the filter</td>
        </tr>
      </table>
  
      <!-- You can add pagination here -->
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of employees"></mat-paginator>
    </div>
  </div>
