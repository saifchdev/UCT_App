<div class="codes-content">
    <div class="codes-header">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search stage Codes</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Filter...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="addNewstageCode()">
        <mat-icon>add</mat-icon> Add stage Code
      </button>
    </div>
  
    <div class="mat-elevation-z4 table-container">
      <table mat-table [dataSource]="dataSource" class="codes-table">
        
        <!-- ID Column -->
        <ng-container matColumnDef="stageId">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let code"> {{code.stageId}} </td>
        </ng-container>
  
        <!-- Name Column -->
        <ng-container matColumnDef="stageName">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let code"> {{code.stageName}} </td>
        </ng-container>
  
        
        <!-- Status Column -->
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let code"> 
           <mat-chip-listbox>
              <mat-chip [color]="code.isActive ? 'primary' : 'warn'" selected>
                {{code.isActive ? 'Active' : 'Inactive'}}
              </mat-chip>
            </mat-chip-listbox>
          </td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let code">
            <button mat-icon-button color="primary" (click)="editstageCode(code)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletestageCode(code)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        <!-- Row shown when there is no matching data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="6">No data matching the filter</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Select page of stage codes"></mat-paginator>
    </div>
  </div>
